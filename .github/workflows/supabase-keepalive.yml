# Supabase free projects are paused after about a week without activity.
# This pings your database every 3 days so the live site doesn't go dark.
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions ->
# add SUPABASE_URL and SUPABASE_ANON_KEY (your PRODUCTION project's values).
name: supabase-keepalive
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the uploads table
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/uploads?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
